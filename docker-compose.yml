services:
  api:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    environment:
      APP_GREETING: "Hello from Compose"
      ConnectionStrings__Default: "Server=db,1433;Database=AppDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-DEV_ONLY_change_this_jwt_signing_key_min_32_chars}"
      Identity__AdminPassword: "${ADMIN_PASSWORD:-Admin#12345}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sql_data:

networks:
  backend:
    driver: bridge